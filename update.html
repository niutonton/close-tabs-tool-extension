<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Close Tabs Tool 更新日志</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            padding: 20px 40px;
            max-width: 800px;
            margin: 20px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h1, h2 {
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .version {
            color: #1a73e8;
        }
        li {
            margin-bottom: 10px;
        }
    </style>

<body>
    <h1>感谢更新 Close Tabs Tool!</h1>

    <h2><span class="version">3.9 版本</span> 新功能 ✨</h2>
    <ul>
        <li><strong>强大的框选功能</strong>：现在，您可以在标签页列表的空白区域按住鼠标拖动，以框选多个标签页，并进行批量关闭或批量拖拽！</li>
        <li><strong>批量拖拽排序</strong>：框选多个标签页后，按住其中任意一个，即可将它们作为一个整体，在窗口内或跨窗口移动。</li>
        <li><strong>图标优化</strong>：为“固定标签页”功能增加了一个更直观的图钉(📌)图标。</li>
        <li><strong>新功能引导</strong>：在程序上方增加了“可批量框选进行操作”的提示，帮助您发现新功能。</li>
    </ul>

    <p>感谢您的使用和支持！如果您有任何问题或建议，欢迎随时与我们联系。</p>
